<body><div id="app">
<header class="top"><div class="brand">블랙헤드 <span>뽑기</span></div><div class="pill">끝없는 코 관리 시뮬레이터</div></header>
<section class="screen intro active" id="intro"><div class="intro-inner"><div><h1>블랙헤드<br><em>뽑기</em></h1><p>콕 집어서, 꾹 눌러서, 쏙—<br>오늘도 코는 평화롭지 않다</p><button class="start" id="start">시 작</button><div class="hint">※ 너무 깊게 집으면 큰일 날지도…</div></div><div class="face-card"><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="smile"></i><i class="mouth"></i></div></div></div></section>
<section class="screen game" id="game"><div class="hud"><div><div class="counter"><span id="count">0</span>개 뽑음</div><div class="tool-note">블랙헤드를 누른 채 잠깐 버티면 뽁!</div></div><div class="game-actions"><button class="soft-btn" id="sound">🔊 소리 켜짐</button><button class="soft-btn" id="reset">처음부터</button></div></div>
<div class="stage" id="stage"><div class="best-score" id="bestScore">최고 점수: 0개</div><div class="big-face" id="bigFace"><i class="brow l"></i><i class="brow r"></i><i class="eye2 l"></i><i class="eye2 r"></i><div class="nose" id="nose"><i class="nostril l"></i><i class="nostril r"></i><div class="pores" id="pores"></div></div><div class="face-mouth"></div><div class="tears"></div></div>
<div class="tweezer" id="tweezer"><svg viewBox="0 0 100 110" fill="none"><path d="M12 8 C15 30 27 51 48 80 L54 99" stroke="#a6a6a3" stroke-width="7" stroke-linecap="round"/><path d="M22 5 C25 28 35 50 52 78 L54 99" stroke="#eeeeea" stroke-width="4" stroke-linecap="round"/><path d="M58 99 L54 106 L51 98" fill="#8c8c88" stroke="#777" stroke-width="2"/><path d="M12 8 L22 5" stroke="#777" stroke-width="3"/></svg></div><div class="toast" id="toast"></div><div class="gameover" id="gameover"><div class="over-card"><h2>으아아앙!!</h2><p>앗, 너무 세게 집어버렸다…<br>코가 빨개져서 더는 못 하겠어!</p><p>이번 기록: <b id="finalCount">0</b>개</p><button class="retry" id="retry">다시 도전하기</button></div></div></div><div class="footer">검은 점을 꾹 눌러 뽑아보세요 · 코 바깥에는 블랙헤드가 없습니다</div></section>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);let count=0,heads=[],holes=[],dangerIds=new Set(),soundOn=true,gameEnded=false,pressTimer=null,pressTarget=null,refillTimer=null,dangerTimer=null,ctx=null;
const stage=$('stage'),pores=$('pores'),nose=$('nose'),tweezer=$('tweezer'),face=$('bigFace');
function audio(freq=700,duration=.09,type='sine',volume=.05){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.stop(ctx.currentTime+duration)}catch(e){}}
function popSound(){audio(950,.07,'sine');setTimeout(()=>audio(520,.12,'triangle',.07),45)}
function coords(){let out=[],tries=0;while(out.length<34&&tries<400){tries++;let x=8+Math.random()*84,y=7+Math.random()*82;if(out.every(p=>Math.hypot(p.x-x,p.y-y)>10))out.push({x,y})}return out}
function makeHead(p,danger=false){const el=document.createElement('i');el.className='head'+(danger?' danger':'');el.style.left=p.x+'%';el.style.top=p.y+'%';el.dataset.id=p.id;el.setAttribute('aria-label','블랙헤드');pores.appendChild(el);heads.push({...p,el,danger});return el}
function seed(){pores.innerHTML='';heads=[];holes=[];dangerIds.clear();const ps=coords();ps.forEach((p,i)=>{p.id='h'+i;makeHead(p,false)});shuffleDanger()}
function shuffleDanger(){if(gameEnded)return;dangerIds.clear();heads.forEach(h=>{h.danger=false;h.el.classList.remove('danger')});const candidates=heads.slice();for(let i=candidates.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}candidates.slice(0,2+Math.floor(Math.random()*2)).forEach(h=>{h.danger=true;h.el.classList.add('danger');dangerIds.add(h.id)})}
function refill(){if(gameEnded)return;const missing=34-heads.length;if(missing>0){const ps=coords();ps.forEach(p=>{if(heads.length>=34)return;if(heads.every(h=>Math.hypot(h.x-p.x,h.y-p.y)>8)){p.id='h'+Date.now()+Math.random();makeHead(p,false)}});shuffleDanger()}}
function makeHole(h){const hole=document.createElement('i');hole.className='hole';hole.style.left=h.x+'%';hole.style.top=h.y+'%';pores.appendChild(hole);holes.push(hole);setTimeout(()=>{hole.remove();holes=holes.filter(x=>x!==hole);if(!gameEnded)refill()},10000)}
function burst(x,y,items=['✨','🎉','⭐','💛']){for(let i=0;i<22;i++){const e=document.createElement('span');e.className='particle';e.textContent=items[Math.floor(Math.random()*items.length)];e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--x',(Math.random()*360-180)+'px');e.style.setProperty('--y',(Math.random()*-240-30)+'px');stage.appendChild(e);setTimeout(()=>e.remove(),1600)}}
function showToast(text){const t=$('toast');t.textContent=text;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');burst(stage.clientWidth/2,stage.clientHeight*.24,['🎉','✨','🎊','⭐'])}
function extract(h){if(gameEnded)return;if(h.danger){gameOver();return}h.el.remove();heads=heads.filter(x=>x!==h);count++;$('count').textContent=count;makeHole(h);popSound();face.classList.add('happy');setTimeout(()=>face.classList.remove('happy'),650);const r=h.el.getBoundingClientRect(),sr=stage.getBoundingClientRect();const txt=document.createElement('span');txt.className='poptext';txt.textContent='뽁!';txt.style.left=(r.left-sr.left)+'px';txt.style.top=(r.top-sr.top)+'px';stage.appendChild(txt);setTimeout(()=>txt.remove(),850);if(count%30===0)showToast(`${count}개 돌파 축하!!`);else if(Math.random()<.12)burst(r.left-sr.left,r.top-sr.top,['💨','✨','💛']);if(heads.length<25)refill()}
function gameOver(){gameEnded=true;clearTimeout(pressTimer);clearInterval(refillTimer);clearInterval(dangerTimer);audio(180,.4,'sawtooth',.07);face.classList.remove('happy');face.classList.add('cry');$('finalCount').textContent=count;$('gameover').classList.add('show');tweezer.classList.add('hidden')}
function start(){count=0;gameEnded=false;$('count').textContent='0';$('gameover').classList.remove('show');face.classList.remove('cry','happy');tweezer.classList.remove('hidden');$('intro').classList.remove('active');$('game').classList.add('active');seed();clearInterval(refillTimer);clearInterval(dangerTimer);refillTimer=setInterval(refill,10000);dangerTimer=setInterval(shuffleDanger,30000)}
$('start').addEventListener('click',start);$('retry').addEventListener('click',start);$('reset').addEventListener('click',()=>{if(confirm('기록을 초기화하고 처음부터 할까?'))start()});$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 소리 켜짐':'🔇 소리 꺼짐';if(soundOn)audio()});
function move(e){const r=stage.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;tweezer.style.left=x+'px';tweezer.style.top=y+'px';tweezer.style.transform=`translate(-12px,-12px) rotate(${x>r.width/2?-18:18}deg)`}
stage.addEventListener('pointermove',e=>{move(e);if(pressTarget&&!gameEnded){const h=heads.find(x=>x.id===pressTarget);if(h){const r=h.el.getBoundingClientRect();tweezer.style.left=(r.left-stage.getBoundingClientRect().left+r.width/2)+'px';tweezer.style.top=(r.top-stage.getBoundingClientRect().top+r.height/2)+'px'}}});
stage.addEventListener('pointerdown',e=>{if(gameEnded)return;const hEl=e.target.closest('.head');if(!hEl)return;e.preventDefault();const h=heads.find(x=>x.id===hEl.dataset.id);if(!h)return;pressTarget=h.id;hEl.style.transform='scale(.75)';audio(240,.08,'triangle',.025);pressTimer=setTimeout(()=>{if(pressTarget===h.id&&!gameEnded)extract(h);pressTarget=null},650)});
function cancelPress(){if(pressTimer)clearTimeout(pressTimer);if(pressTarget){const h=heads.find(x=>x.id===pressTarget);if(h)h.el.style.transform=''}pressTarget=null}stage.addEventListener('pointerup',cancelPress);stage.addEventListener('pointerleave',()=>{if(pressTarget)cancelPress()});stage.addEventListener('pointercancel',cancelPress);
})();
</script>
<script>
(()=> {
const $=id=>document.getElementById(id),stage=$('stage'),pores=$('pores'),face=$('bigFace'),tweezer=$('tweezer');
let held=null,root=null,dead=false,refillLoop=null,dangerLoop=null,localCount=0,audioCtx=null,pullStarted=0;
function pop(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;/* rounded wet lip-smack with a sticky, elastic release; no airy noise */const mk=(freq,peak,dur,delay=0)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(freq,t+delay);o.frequency.exponentialRampToValueAtTime(Math.max(55,freq*.62),t+delay+dur);f.type='lowpass';f.frequency.setValueAtTime(1150,t+delay);f.frequency.exponentialRampToValueAtTime(360,t+delay+dur);o.connect(f);f.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.001,t+delay);g.gain.linearRampToValueAtTime(peak,t+delay+.012);g.gain.setValueAtTime(peak*.9,t+delay+dur*.28);g.gain.exponentialRampToValueAtTime(.001,t+delay+dur);o.start(t+delay);o.stop(t+delay+dur+.01)};mk(620,.13,.075,0);mk(330,.2,.2,.045);mk(235,.17,.26,.095);mk(145,.11,.29,.14)}catch(e){}}
function coords(){const hs=[...pores.querySelectorAll('.head')];let x=8,y=8,tries=0;do{x=8+Math.random()*84;y=7+Math.random()*82;tries++}while(tries<250&&hs.some(h=>Math.hypot(parseFloat(h.style.left)-x,parseFloat(h.style.top)-y)<9));return{x,y}}
function addHead(x,y){if(pores.querySelectorAll('.head').length>=34)return;const h=document.createElement('i');h.className='head';h.dataset.id='final'+Math.random();h.style.left=x+'%';h.style.top=y+'%';pores.appendChild(h);return h}
function shuffleDanger(){if(dead)return;const hs=[...pores.querySelectorAll('.head')];hs.forEach(h=>h.classList.remove('danger'));hs.sort(()=>Math.random()-.5).slice(0,Math.min(2+Math.floor(Math.random()*2),hs.length)).forEach(h=>h.classList.add('danger'))}
function celebration(){face.classList.add('happy','blush');setTimeout(()=>face.classList.remove('happy','blush'),2100);const toast=$('toast');toast.textContent='경축 : '+localCount+'개 돌파';toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');const r=stage.getBoundingClientRect(),bits=['🎉','✨','🎊','⭐','💥','💖','🥳','🌟','💫','🎈','🪅','💎'];for(let i=0;i<150;i++){const p=document.createElement('span');p.className='particle';p.textContent=bits[Math.floor(Math.random()*bits.length)];p.style.left=Math.random()*r.width+'px';p.style.top=Math.random()*r.height+'px';p.style.setProperty('--x',(Math.random()*r.width-r.width/2)+'px');p.style.setProperty('--y',(Math.random()*r.height-r.height/2)+'px');stage.appendChild(p);setTimeout(()=>p.remove(),1800)}}
function finishGame(){if(dead)return;dead=true;held=null;face.classList.remove('happy','blush');face.classList.add('cry');clearInterval(refillLoop);clearInterval(dangerLoop);try{const c=new(window.AudioContext||window.webkitAudioContext)(),t=c.currentTime;const duration=1.65,sr=c.sampleRate,buffer=c.createBuffer(1,Math.floor(sr*duration),sr),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++){const x=i/sr;const envelope=Math.min(1,x/.09)*Math.max(0,1-x/duration);const sob=Math.sin(2*Math.PI*(5.1*x+0.9*Math.sin(2*Math.PI*2.4*x))*x*0.8);const wav=Math.sin(2*Math.PI*(330-85*x+24*Math.sin(2*Math.PI*3.2*x))*x);data[i]=envelope*(.28*wav+.18*sob)*(Math.random()*.22+.78)}const src=c.createBufferSource(),filter=c.createBiquadFilter(),gain=c.createGain();src.buffer=buffer;filter.type='lowpass';filter.frequency.value=1250;gain.gain.setValueAtTime(.001,t);gain.gain.linearRampToValueAtTime(.62,t+.06);gain.gain.setValueAtTime(.62,t+1.1);gain.gain.exponentialRampToValueAtTime(.001,t+duration);src.connect(filter);filter.connect(gain);gain.connect(c.destination);src.start(t);src.stop(t+duration)}catch(e){}setTimeout(()=>{if(!dead)return;$('finalCount').textContent=localCount;$('gameover').querySelector('h2').textContent='아파요';$('gameover').querySelector('p').textContent='아이고 시벌 잘못 뽑았다';$('gameover').classList.add('show')},2000)}
function startTimers(){clearInterval(refillLoop);clearInterval(dangerLoop);dead=false;localCount=0;$('count').textContent='0';face.classList.remove('cry','happy','blush');$('gameover').classList.remove('show');tweezer.classList.remove('hidden');refillLoop=setInterval(()=>{if(dead)return;if(pores.querySelectorAll('.head').length<34){const p=coords();addHead(p.x,p.y)}},10000);dangerLoop=setInterval(shuffleDanger,30000);setTimeout(shuffleDanger,100)}
const observer=new MutationObserver(()=>{if($('game').classList.contains('active'))startTimers()});observer.observe($('game'),{attributes:true,attributeFilter:['class']});
function placeTweezer(e){const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;tweezer.style.left=(x-53)+'px';tweezer.style.top=(y-103)+'px';tweezer.style.transform='rotate(0deg)';}
function makeRoot(e){if(root||dead)return;const s=stage.getBoundingClientRect();root=document.createElement('i');root.style.cssText='position:absolute;z-index:14;width:9px;height:44px;border-radius:50% 50% 35% 35%;background:linear-gradient(90deg,#6d4c2c,#d4aa6c,#5b3b20);left:'+(e.clientX-s.left)+'px;top:'+(e.clientY-s.top)+'px;pointer-events:none;transform-origin:top;transform:translate(-50%,-100%) scaleY(1.1)';stage.appendChild(root)}
stage.addEventListener('pointerdown',e=>{const h=e.target.closest('.head');if(!h||dead)return;e.preventDefault();e.stopImmediatePropagation();held=h;pullStarted=performance.now();placeTweezer(e);if(h.classList.contains('danger')){h.style.background='#e33';finishGame();return}root=null;h.style.transition='transform .18s ease';h.style.transform='translateY(-7px) scale(1.15)';setTimeout(()=>{if(held===h&&!dead&&performance.now()-pullStarted>=200)completeExtraction(h,lastPointerEvent||e)},200)},true);
let lastPointerEvent=null;
function completeExtraction(h,e){if(!held||held!==h||root||dead)return;const s=stage.getBoundingClientRect(),x=parseFloat(h.style.left),y=parseFloat(h.style.top);h.remove();held=null;const hole=document.createElement('i');hole.className='hole';hole.style.left=x+'%';hole.style.top=y+'%';pores.appendChild(hole);setTimeout(()=>{hole.remove();if(!dead)addHead(x,y)},10000);localCount++;$('count').textContent=localCount;pop();face.classList.add('happy');setTimeout(()=>face.classList.remove('happy'),550);makeRoot(e);if(localCount%30===0)celebration();if(pores.querySelectorAll('.head').length<28){const p=coords();addHead(p.x,p.y)}}
window.addEventListener('pointermove',e=>{lastPointerEvent=e;if(held)placeTweezer(e);if(root){const s=stage.getBoundingClientRect();root.style.left=(e.clientX-s.left)+'px';root.style.top=(e.clientY-s.top)+'px'}},true);
window.addEventListener('pointerup',()=>{if(held){const h=held;held=null;h.style.transform='';h.style.transition=''}if(!root)return;const falling=root;root=null;falling.style.transition='top .45s cubic-bezier(.2,.8,.3,1),transform .45s ease';falling.style.top=(parseFloat(falling.style.top)+105)+'px';falling.style.transform='translate(-50%,-100%) rotate(0deg) scaleY(1.35)';setTimeout(()=>falling.remove(),480)},false);
$('retry').addEventListener('click',()=>{dead=false;localCount=0;clearInterval(refillLoop);clearInterval(dangerLoop);pores.innerHTML='';for(let i=0;i<30;i++){const p=coords();addHead(p.x,p.y)}$('count').textContent='0';$('gameover').classList.remove('show');face.classList.remove('cry','happy','blush');startTimers()},true);
})();
</script>
<script>
(()=>{
const $=id=>document.getElementById(id),stage=$('stage'),tool=$('tweezer'),face=$('bigFace'),count=$('count');
const lines=['무릉도원이네요','씨원해요','(벌름벌름)','콧구멍 벌름거려도 되나요','언제까지 뽑아주실 건가요','저 딸기코 탈출할 수 있을까요'];
let lastSpoken=0,ctx=null;
function soundNotes(notes){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const now=ctx.currentTime;notes.forEach(([freq,start,duration,type='triangle',vol=.09])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now+start);g.gain.setValueAtTime(.001,now+start);g.gain.linearRampToValueAtTime(vol,now+start+.025);g.gain.exponentialRampToValueAtTime(.001,now+start+duration);o.connect(g);g.connect(ctx.destination);o.start(now+start);o.stop(now+start+duration+.02)})}catch(e){}}
function pluck(){soundNotes([[420,0,.07,'sine',.04],[620,.045,.1,'triangle',.07],[290,.1,.13,'sine',.08],[520,.17,.16,'triangle',.06]])}
function fanfare(){soundNotes([[523,0,.22],[659,.13,.22],[784,.26,.28],[1047,.42,.48,'triangle',.11],[784,.48,.38]])}
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;tool.style.left=(x-53)+'px';tool.style.top=(y-103)+'px';tool.style.transform='rotate(0deg)'},true);
const obs=new MutationObserver(()=>{const n=Number(count.textContent)||0;if(n>lastSpoken&&n%12===0){const bubble=document.createElement('div');bubble.className='speech-line';bubble.textContent=lines[Math.floor(Math.random()*lines.length)];stage.appendChild(bubble);face.classList.add('talking');setTimeout(()=>{bubble.remove();face.classList.remove('talking')},2100)}if(n%30===0&&n>lastSpoken)fanfare();lastSpoken=n});
obs.observe(count,{childList:true,characterData:true,subtree:true});
})();
</script><script>
(()=>{const face=document.getElementById('bigFace'),stage=document.getElementById('stage'),count=document.getElementById('count');let last=0,audio=null;const style=document.createElement('style');style.textContent='.big-face.cry .eye2{width:12%!important;height:2%!important;top:21%!important;border-radius:50%!important;transform:rotate(12deg) scaleY(.65)!important}.big-face.cry .eye2.r{transform:rotate(-12deg) scaleY(.65)!important}.waterfall{position:absolute;z-index:16;top:22%;width:clamp(8px,1.5vw,18px);height:clamp(70px,15vh,140px);border-radius:50% 50% 65% 65%;background:linear-gradient(90deg,#58bce9,#d8f8ff 38%,#4aaee6 72%,#e0fbff);box-shadow:0 0 8px #70d5ff,0 0 18px #70d5ff;animation:waterfall .28s linear infinite;pointer-events:none}.waterfall.l{left:18%}.waterfall.r{right:18%;animation-delay:-.14s}.waterfall:after{content:"";position:absolute;top:68%;left:10%;width:80%;height:110%;border-radius:40%;background:linear-gradient(90deg,#60c5ef,#d7f8ff,#4aaee6);animation:waterfall-tail .2s linear infinite}@keyframes waterfall{0%{transform:translateY(-22px) scaleY(.7)}100%{transform:translateY(48px) scaleY(1.4)}}@keyframes waterfall-tail{0%{transform:translateY(-8px) scaleY(.5)}100%{transform:translateY(34px) scaleY(1.5)}}.waterfall-splash{position:absolute;z-index:17;width:9px;height:18px;border-radius:50%;background:#8bdfff;box-shadow:0 0 8px #70d5ff;animation:splash .55s ease-in infinite;pointer-events:none}@keyframes splash{0%{transform:translate(0,-20px) scale(.4);opacity:1}100%{transform:translate(var(--sx),var(--sy)) scale(1.5);opacity:0}}';document.head.appendChild(style);const obs=new MutationObserver(()=>{if(face.classList.contains('cry')&&!face.querySelector('.waterfall')){for(const side of ['l','r']){const stream=document.createElement('i');stream.className='waterfall '+side;face.appendChild(stream)}for(let i=0;i<60;i++){const d=document.createElement('i');d.className='waterfall-splash';d.style.left=Math.random()*stage.clientWidth+'px';d.style.top=stage.clientHeight*(.2+Math.random()*.75)+'px';d.style.setProperty('--sx',(Math.random()*200-100)+'px');d.style.setProperty('--sy',(Math.random()*160+40)+'px');d.style.animationDelay=-Math.random()*.55+'s';stage.appendChild(d)}}else if(!face.classList.contains('cry')){face.querySelectorAll('.waterfall').forEach(x=>x.remove());stage.querySelectorAll('.waterfall-splash').forEach(x=>x.remove())}});obs.observe(face,{attributes:true,attributeFilter:['class']});function mumble(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const t=audio.currentTime;for(let i=0;i<8;i++){const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(105+Math.random()*65,t+i*.085);o.frequency.linearRampToValueAtTime(75+Math.random()*55,t+i*.085+.11);f.type='lowpass';f.frequency.value=430;g.gain.setValueAtTime(.001,t+i*.085);g.gain.linearRampToValueAtTime(.045,t+i*.085+.025);g.gain.exponentialRampToValueAtTime(.001,t+i*.085+.13);o.connect(f);f.connect(g);g.connect(audio.destination);o.start(t+i*.085);o.stop(t+i*.085+.14)}}catch(e){}}const countObs=new MutationObserver(()=>{const n=Number(count.textContent)||0;if(n>last&&n%12===0)mumble();last=n});countObs.observe(count,{childList:true,characterData:true,subtree:true})})();
</script><script>
(()=>{const count=document.getElementById('count'),best=document.getElementById('bestScore');let record=0;try{record=Number(localStorage.getItem('blackheadBestScore'))||0}catch(e){}best.textContent='최고 점수: '+record+'개';const obs=new MutationObserver(()=>{const n=Number(count.textContent)||0;if(n>record){record=n;best.textContent='최고 점수: '+record+'개';try{localStorage.setItem('blackheadBestScore',String(record))}catch(e){}}});obs.observe(count,{childList:true,characterData:true,subtree:true})})();
