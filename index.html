<body><div id="app">
<header class="top"><div class="brand">블랙헤드 <span>뽑기</span></div><div class="pill">끝없는 코 관리 시뮬레이터</div></header>
<section class="screen intro active" id="intro"><div class="intro-inner"><div><h1>블랙헤드<br><em>뽑기</em></h1><p>콕 집어서, 꾹 눌러서, 쏙—<br>오늘도 코는 평화롭지 않다</p><button class="start" id="start">시 작</button><div class="hint">※ 너무 깊게 집으면 큰일 날지도…</div></div><div class="face-card"><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="smile"></i><i class="mouth"></i></div></div></div></section>
<section class="screen game" id="game"><div class="hud"><div><div class="counter"><span id="count">0</span>개 뽑음</div><div class="tool-note">블랙헤드를 누른 채 잠깐 버티면 뽁!</div></div><div class="game-actions"><button class="soft-btn" id="sound">🔊 소리 켜짐</button><button class="soft-btn" id="reset">처음부터</button></div></div>
<div class="stage" id="stage"><div class="best-score" id="bestScore">최고 점수: 0개</div><div class="big-face" id="bigFace"><i class="brow l"></i><i class="brow r"></i><i class="eye2 l"></i><i class="eye2 r"></i><div class="nose" id="nose"><i class="nostril l"></i><i class="nostril r"></i><div class="pores" id="pores"></div></div><div class="face-mouth"></div><div class="tears"></div></div>
<div class="tweezer" id="tweezer"><svg viewBox="0 0 100 110" fill="none"><path d="M12 8 C15 30 27 51 48 80 L54 99" stroke="#a6a6a3" stroke-width="7" stroke-linecap="round"/><path d="M22 5 C25 28 35 50 52 78 L54 99" stroke="#eeeeea" stroke-width="4" stroke-linecap="round"/><path d="M58 99 L54 106 L51 98" fill="#8c8c88" stroke="#777" stroke-width="2"/><path d="M12 8 L22 5" stroke="#777" stroke-width="3"/></svg></div><div class="toast" id="toast"></div><div class="gameover" id="gameover"><div class="over-card"><h2>으아아앙!!</h2><p>앗, 너무 세게 집어버렸다…<br>코가 빨개져서 더는 못 하겠어!</p><p>이번 기록: <b id="finalCount">0</b>개</p><button class="retry" id="retry">다시 도전하기</button></div></div></div><div class="footer">검은 점을 꾹 눌러 뽑아보세요 · 코 바깥에는 블랙헤드가 없습니다</div></section>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);let count=0,heads=[],holes=[],dangerIds=new Set(),soundOn=true,gameEnded=false,pressTimer=null,pressTarget=null,refillTimer=null,dangerTimer=null,ctx=null;
const stage=$('stage'),pores=$('pores'),nose=$('nose'),tweezer=$('tweezer'),face=$('bigFace');
function audio(freq=700,duration=.09,type='sine',volume=.05){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.stop(ctx.currentTime+duration)}catch(e){}}
function popSound(){audio(950,.07,'sine');setTimeout(()=>audio(520,.12,'triangle',.07),45)}
function coords(){let out=[],tries=0;while(out.length<34&&tries<400){tries++;let x=8+Math.random()*84,y=7+Math.random()*82;if(out.every(p=>Math.hypot(p.x-x,p.y-y)>10))out.push({x,y})}return out}
function makeHead(p,danger=false){const el=document.createElement('i');el.className='head'+(danger?' danger':'');el.style.left=p.x+'%';el.style.top=p.y+'%';el.dataset.id=p.id;el.setAttribute('aria-label','블랙헤드');pores.appendChild(el);heads.push({...p,el,danger});return el}
function seed(){pores.innerHTML='';heads=[];holes=[];dangerIds.clear();const ps=coords();ps.forEach((p,i)=>{p.id='h'+i;makeHead(p,false)});shuffleDanger()}
function shuffleDanger(){if(gameEnded)return;dangerIds.clear();heads.forEach(h=>{h.danger=false;h.el.classList.remove('danger')});const candidates=heads.slice();for(let i=candidates.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}candidates.slice(0,2+Math.floor(Math.random()*2)).forEach(h=>{h.danger=true;h.el.classList.add('danger');dangerIds.add(h.id)})}
function refill(){if(gameEnded)return;const missing=34-heads.length;if(missing>0){const ps=coords();ps.forEach(p=>{if(heads.length>=34)return;if(heads.every(h=>Math.hypot(h.x-p.x,h.y-p.y)>8)){p.id='h'+Date.now()+Math.random();makeHead(p,false)}});shuffleDanger()}}

 stage.appendChild(widget);
 const button=$('tissueButton');
 function updateGauge(){gauge=Math.min(50,gauge);const pct=Math.round(gauge/50*100);const fill=$('tissueGaugeFill'),label=$('tissueGaugeLabel'),track=widget.querySelector('.tissue-gauge');if(fill)fill.style.width=pct+'%';if(label)label.textContent=pct===100?'사용 가능! 100%':'게이지 '+pct+'%';if(track)track.setAttribute('aria-valuenow',String(gauge));if(gauge>=50){button.disabled=false;button.classList.add('ready')}else{button.disabled=true;button.classList.remove('ready')}}
 window.__resetTissueGauge=()=>{gauge=0;updateGauge();lastCount=Number(count.textContent)||0};
 function confetti(){const r=stage.getBoundingClientRect(),bits=['🌸','🌼','🌺','✨','💖','⭐','🌷','💫','✿','❀'];for(let i=0;i<190;i++){const p=document.createElement('span');p.className='particle';p.textContent=bits[Math.floor(Math.random()*bits.length)];p.style.left=(Math.random()*r.width)+'px';p.style.top=(Math.random()*r.height*.85)+'px';p.style.setProperty('--x',(Math.random()*r.width-r.width/2)+'px');p.style.setProperty('--y',(Math.random()*r.height*.7-r.height*.45)+'px');p.style.animationDuration=(1.1+Math.random()*1.5)+'s';stage.appendChild(p);setTimeout(()=>p.remove(),2800)}}
 function clean(){if(button.disabled||cleaning)return;cleaning=true;cleanLock=true;gauge=0;updateGauge();
   // Prevent any marked game-over head from triggering during the wipe.
   stage.querySelectorAll('.head').forEach(h=>{h.classList.remove('danger');h.style.pointerEvents='none'});
   const roots=[...stage.querySelectorAll('.root')];roots.forEach((root,i)=>{root.style.transition='top .55s ease-in, opacity .55s ease';root.style.top=(stage.clientHeight+80+i*3)+'px';root.style.opacity='0';setTimeout(()=>root.remove(),600)});
   const sweep=document.createElement('div');sweep.className='tissue-sweep';stage.appendChild(sweep);setTimeout(()=>sweep.remove(),1200);
   const glow=document.createElement('div');glow.className='clean-glow';stage.appendChild(glow);setTimeout(()=>glow.remove(),1900);
   // Count every blackhead swept away as collected, then remove them without triggering game-over.
   const sweptHeads=[...pores.querySelectorAll('.head')];
   if(sweptHeads.length){const current=Number(count.textContent)||0;count.textContent=String(current+sweptHeads.length);}
   sweptHeads.forEach(h=>h.remove());
   face.classList.add('happy','blush');
   const shout=document.createElement('div');shout.className='speech-line';shout.style.cssText='position:absolute;z-index:29;left:50%;top:43%;transform:translate(-50%,-50%);font-family:"궁서","Batang",serif;font-weight:1000;font-size:clamp(38px,7vw,78px);color:#b90019;text-shadow:1px 1px 0 #ffb0a8;white-space:nowrap';shout.textContent='우와우!!!!!';stage.appendChild(shout);
   confetti();try{const c=new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<9;i++){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=850+Math.random()*900;g.gain.setValueAtTime(.001,c.currentTime+i*.055);g.gain.linearRampToValueAtTime(.045,c.currentTime+i*.055+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.055+.13);o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.055);o.stop(c.currentTime+i*.055+.14)}}catch(e){}
   setTimeout(()=>{shout.remove();face.classList.remove('happy','blush');cleaning=false;cleanLock=false;let n=0;const spawn=setInterval(()=>{if(!stage.classList.contains('x')){} if(stage.querySelectorAll('.head').length<34){const h=document.createElement('i');h.className='head';h.dataset.id='clean'+Math.random();let x,y,tries=0,existing=[...pores.querySelectorAll('.head')];do{x=8+Math.random()*84;y=7+Math.random()*82;tries++}while(tries<100&&existing.some(e=>Math.hypot(parseFloat(e.style.left)-x,parseFloat(e.style.top)-y)<9));h.style.left=x+'%';h.style.top=y+'%';pores.appendChild(h);n++;}if(n>=12||stage.querySelectorAll('.head').length>=34)clearInterval(spawn)},650)},1900);
 }
 button.addEventListener('click',clean);
 // Count normal heads as one and golden heads as five; the existing game counter is the source of truth.
 let lastCount=Number(count.textContent)||0;
 const countObserver=new MutationObserver(()=>{const n=Number(count.textContent)||0;const delta=n-lastCount;if(delta>0&&!cleanLock){gauge=Math.min(50,gauge+delta);updateGauge()}lastCount=n});countObserver.observe(count,{childList:true,characterData:true,subtree:true});
 const gameOverObserver=new MutationObserver(()=>{if($('gameover').classList.contains('show'))window.__resetTissueGauge?.()});gameOverObserver.observe($('gameover'),{attributes:true,attributeFilter:['class']});
 function spawnGold(){if(!$('game').classList.contains('active')||$('gameover').classList.contains('show')||cleaning)return;if(pores.querySelector('.gold-head'))return;const heads=[...pores.querySelectorAll('.head')];let x=8+Math.random()*84,y=7+Math.random()*82,tries=0;while(tries++<100&&heads.some(h=>Math.hypot(parseFloat(h.style.left)-x,parseFloat(h.style.top)-y)<10)){x=8+Math.random()*84;y=7+Math.random()*82}const h=document.createElement('i');h.className='head gold-head';h.dataset.id='gold'+Date.now();h.style.left=x+'%';h.style.top=y+'%';h.dataset.gold='true';pores.appendChild(h)}
 goldTimer=setInterval(spawnGold,20000);
 // Gold extraction: slightly longer hold, +5 score, then the root is comically chewed instead of dropped.
 const originalHeads=()=>[...pores.querySelectorAll('.head')];
 window.addEventListener('pointerdown',e=>{const h=e.target.closest('.gold-head');if(!h||cleaning)return;e.preventDefault();e.stopImmediatePropagation();if(h.dataset.busy==='1')return;h.dataset.busy='1';h.style.transform='scale(1.2)';setTimeout(()=>{if(!h.isConnected||cleaning)return;const r=h.getBoundingClientRect(),sr=stage.getBoundingClientRect();h.remove();const hole=document.createElement('i');hole.className='hole';hole.style.left=parseFloat(h.style.left)+'%';hole.style.top=parseFloat(h.style.top)+'%';pores.appendChild(hole);setTimeout(()=>hole.remove(),6000);
   const now=Number(count.textContent)||0;count.textContent=String(now+5);goldCount++;face.classList.add('talking','happy');setTimeout(()=>face.classList.remove('talking','happy'),1300);
   const line=document.createElement('div');line.className='speech-line';line.style.cssText='position:absolute;z-index:28;left:50%;top:9%;transform:translateX(-50%);font-family:"궁서","Batang",serif;font-size:clamp(17px,3vw,30px);font-weight:bold;color:#a87900;white-space:nowrap;text-shadow:0 0 5px #fff';line.textContent=firstGold?'블랙헤드는 무슨 맛일까요':'뭔가 중독적인 맛';firstGold=false;stage.appendChild(line);setTimeout(()=>line.remove(),2200);
   const root=document.createElement('i');root.className='root';root.style.cssText='position:absolute;z-index:14;width:11px;height:48px;border-radius:50% 50% 35% 35%;background:linear-gradient(90deg,#6d4c2c,#d4aa6c,#5b3b20);left:'+(r.left-sr.left+r.width/2)+'px;top:'+(r.top-sr.top)+'px;pointer-events:none;transform:translate(-50%,-100%)';stage.appendChild(root);
   const mouth=face.querySelector('.face-mouth');if(mouth)mouth.classList.add('gold-chew');const br=face.getBoundingClientRect();root.style.transition='left .35s ease,top .35s ease,transform .35s ease';root.style.left=(br.left-sr.left+br.width*.5)+'px';root.style.top=(br.top-sr.top+br.height*.82)+'px';root.style.transform='translate(-50%,-50%) rotate(80deg) scale(.65)';
   try{const c=new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<10;i++){const t=c.currentTime+i*.16,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='triangle';o.frequency.setValueAtTime(260+Math.random()*160,t);o.frequency.exponentialRampToValueAtTime(90+Math.random()*45,t+.12);f.type='lowpass';f.frequency.value=700;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.13,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(f);f.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.15)}}catch(err){}
   setTimeout(()=>{root.remove();if(mouth)mouth.classList.remove('gold-chew')},1700);
 },700)},true);
 // Stop all ordinary extraction/game-over input during cleansing animation.
 window.addEventListener('pointerdown',e=>{if(cleaning&&e.target.closest('.head')){e.preventDefault();e.stopImmediatePropagation()}},true);
})();
</script>


<style>
/* A sweet, wordless thank-you kiss every 100 extracted blackheads */
.stage.kiss-scene .big-face{z-index:24;transform:translateX(-50%) scale(1.62) translateY(15%);transform-origin:50% 43%;transition:transform 1s cubic-bezier(.2,.8,.2,1);}
.big-face.kissing{z-index:24;}
.big-face.kissing .eye2{height:3px;border-radius:50%;transform:scaleY(.7);box-shadow:none;background:#5b382c;top:21.8%;}
.big-face.kissing .face-mouth{left:43%;top:79%;width:14%;height:15px;border-radius:50%;background:#d75e7d;border:3px solid #bd4a6a;}
.big-face.kissing:before,.big-face.kissing:after{content:"";position:absolute;top:48%;width:17%;height:9%;border-radius:50%;background:radial-gradient(ellipse,#f28e9fbd 0%,#f5a2a900 78%);z-index:4;pointer-events:none;}
.big-face.kissing:before{left:7%;}.big-face.kissing:after{right:7%;}
.kiss-heart{position:absolute;z-index:28;pointer-events:none;font-size:clamp(24px,4vw,48px);animation:kissFloat 2.1s ease-out forwards;filter:drop-shadow(0 2px 2px #d98c9a55)}
@keyframes kissFloat{0%{opacity:0;transform:translateY(15px) scale(.55) rotate(-12deg)}18%{opacity:1}100%{opacity:0;transform:translateY(-95px) scale(1.25) rotate(14deg)}}
.kiss-shine{position:absolute;z-index:23;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,#fff7f5a8,transparent 65%);animation:kissShine 2.7s ease-in-out forwards}
@keyframes kissShine{0%,100%{opacity:0}25%,65%{opacity:1}}
</style>
<script>
(()=>{
 const $=id=>document.getElementById(id),stage=$('stage'),face=$('bigFace'),count=$('count');
 let nextKiss=100,playing=false,ctx=null;
 function sweetMusic(){
  try{
   ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();
   const now=ctx.currentTime;
   // A tiny, soft, music-box-like melody; synthesized locally, no external audio file.
   const notes=[[659,0,.28],[784,.22,.32],[988,.48,.38],[784,.78,.27],[880,1.02,.3],[1047,1.28,.52],[988,1.72,.32],[784,2.02,.52]];
   notes.forEach(([f,t,d])=>{const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(f,now+t);lp.type='lowpass';lp.frequency.value=2100;g.gain.setValueAtTime(.001,now+t);g.gain.linearRampToValueAtTime(.105,now+t+.035);g.gain.setValueAtTime(.075,now+t+d*.65);g.gain.exponentialRampToValueAtTime(.001,now+t+d);o.connect(lp);lp.connect(g);g.connect(ctx.destination);o.start(now+t);o.stop(now+t+d+.02)});
   // Soft high notes sparkle above the melody
   [[1318,.58,.16],[1568,1.35,.18],[1175,2.05,.22]].forEach(([f,t,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,now+t);g.gain.linearRampToValueAtTime(.035,now+t+.02);g.gain.exponentialRampToValueAtTime(.001,now+t+d);o.connect(g);g.connect(ctx.destination);o.start(now+t);o.stop(now+t+d+.02)});
  }catch(e){}
 }
 function kiss(){if(playing||!$('game').classList.contains('active')||$('gameover').classList.contains('show'))return;playing=true;
  stage.classList.add('kiss-scene');face.classList.add('kissing');
  const shine=document.createElement('div');shine.className='kiss-shine';stage.appendChild(shine);setTimeout(()=>shine.remove(),2800);
  sweetMusic();
  const hearts=['💗','💕','♡','💖','♥'];for(let i=0;i<13;i++){setTimeout(()=>{if(!stage.isConnected)return;const h=document.createElement('span');h.className='kiss-heart';h.textContent=hearts[Math.floor(Math.random()*hearts.length)];h.style.left=(25+Math.random()*50)+'%';h.style.top=(35+Math.random()*35)+'%';stage.appendChild(h);setTimeout(()=>h.remove(),2200)},i*115)}
  // Briefly pause extraction input during the close-up, then return to the exact same game state.
  stage.style.pointerEvents='none';
  setTimeout(()=>{stage.classList.remove('kiss-scene');face.classList.remove('kissing');stage.style.pointerEvents='';playing=false;},2900);
 }
 let previous=Number(count.textContent)||0;
 const observer=new MutationObserver(()=>{const n=Number(count.textContent)||0;if(n<previous){nextKiss=100;}else if(n>=nextKiss&&previous<nextKiss){kiss();nextKiss=(Math.floor(n/100)+1)*100;}previous=n;});
 observer.observe(count,{childList:true,characterData:true,subtree:true});
 const retry=$('retry');retry.addEventListener('click',()=>{nextKiss=100;previous=0;});
})();
</script>
